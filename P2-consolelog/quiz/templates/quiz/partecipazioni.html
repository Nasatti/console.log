{% extends 'quiz/base.html' %}
{% block title %}Partecipazioni{% endblock %}
{% block content %}
<div class="main-wrapper">
  <aside class="sidebar">
    <h2>🔍 Filtra Partecipazioni</h2>
    <div class="filter-group">
      <label>Quiz</label>
      <div class="extracted-style-13262f">
          <input type="text" id="f-quiz-codice" placeholder="Es. 12" data-prefilter="{{ quiz_codice_prefilter }}" autocomplete="off">
        <input class="extracted-style-526a45" type="text" id="f-quiz-titolo" placeholder="Titolo..." autocomplete="off">
      </div>
    </div>
    <div class="filter-group">
      <label for="f-utente">Utente</label>
      <input type="text" id="f-utente" placeholder="— Tutti —" autocomplete="off" data-prefilter="{{ utente_prefilter }}">
      <datalist id="dl-utente">
        {% for u in utenti %}
          <option value="{{ u.nome }} {{ u.cognome }} ({{ u.nomeUtente }})"></option>
        {% endfor %}
      </datalist>
    </div>
    <div class="filter-group">
      <label for="f-data-dal">Data dal</label>
      <input type="date" id="f-data-dal">
    </div>
    <div class="filter-group">
      <label for="f-data-al">Data al</label>
      <input type="date" id="f-data-al">
    </div>
    <div class="filter-group">
      <label>Punteggio % (Min – Max)</label>
      <div class="extracted-style-13262f">
        <input class="extracted-style-4ebf8b" type="number" id="f-perc-min" placeholder="Min %" min="0" max="100">
        <input class="extracted-style-4ebf8b" type="number" id="f-perc-max" placeholder="Max %" min="0" max="100">
      </div>
    </div>
    <button class="btn-reset-filter" id="btn-reset">Azzera filtri</button>
  </aside>

  <main class="main-content">
    <div class="page-title">
      <h2>📊 Tutte le Partecipazioni</h2>
    </div>
    <div class="spinner" id="spinner"></div>
    <div id="results-container" class="table-container-scroll extracted-style-d3297f"></div>
  </main>
</div>
{% endblock %}

{% block extra_scripts %}
{% endblock %}

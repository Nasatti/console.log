{% extends 'quiz/base.html' %}
{% load static %}

{% block title %}Quiz{% endblock %}

{% block content %}
<div class="main-wrapper">

  <aside class="sidebar">
    <h2>🔍 Filtra Quiz</h2>
    <div class="filter-group">
      <label for="f-titolo">Titolo</label>
      <input type="text" id="f-titolo" placeholder="Es. Matematica…" autocomplete="off">
    </div>
    <div class="filter-group">
      <label for="f-creatore">Creatore</label>
      <input type="text" id="f-creatore" placeholder="Cerca creatore..." data-prefilter="{{ creatore_prefilter }}" autocomplete="off">
      <datalist id="dl-creatore">
        {% for u in utenti %}
          <option value="{{ u.nome }} {{ u.cognome }} ({{ u.nomeUtente }})"></option>
        {% endfor %}
      </datalist>
    </div>
    <div class="filter-group">
      <label>Stato</label>
      <div class="checkbox-group">
        <label class="checkbox-label checkbox-label-split"><span class="badge badge-open">✅ Aperto</span> <input type="checkbox" name="f-stato" value="aperto"></label>
        <label class="checkbox-label checkbox-label-split"><span class="badge badge-closed">🔒 Chiuso</span> <input type="checkbox" name="f-stato" value="chiuso"></label>
        <label class="checkbox-label checkbox-label-split"><span class="badge badge-upcoming">🕐 Futuro</span> <input type="checkbox" name="f-stato" value="futuro"></label>
      </div>
    </div>
    <div class="filter-group">
      <label for="f-dal">Data inizio dal</label>
      <input type="date" id="f-dal">
    </div>
    <div class="filter-group">
      <label for="f-al">Data fine entro</label>
      <input type="date" id="f-al">
    </div>
    <button class="btn-reset-filter" id="btn-reset">Azzera filtri</button>
  </aside>

  <main class="main-content">
    <div class="page-title">
      <h2>📋 Quiz Disponibili</h2>
      <div class="title-actions">
        <a href="{% url 'quiz_nuovo' %}" class="btn btn-primary">➕ Nuovo Quiz</a>
      </div>
    </div>

    <div class="spinner" id="spinner"></div>
    <div id="results-container" class="table-container-scroll extracted-style-d3297f"></div>
  </main>
</div>
{% endblock %}

{% block extra_scripts %}
{% endblock %}

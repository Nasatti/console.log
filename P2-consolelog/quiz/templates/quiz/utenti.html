{% extends 'quiz/base.html' %}
{% block title %}Utenti{% endblock %}
{% block content %}
<div class="main-wrapper">
  <aside class="sidebar">
    <h2>🔍 Filtra Utenti</h2>
    <div class="filter-group">
      <label for="f-cognome">Cognome</label>
      <input type="text" id="f-cognome" placeholder="Es. Ferrari…" autocomplete="off">
    </div>
    <div class="filter-group">
      <label for="f-nome">Nome</label>
      <input type="text" id="f-nome" placeholder="Es. Mario…" autocomplete="off">
    </div>
    <div class="filter-group">
      <label for="f-username">Username</label>
      <input type="text" id="f-username" placeholder="Cerca username..." data-prefilter="{{ username_prefilter }}" autocomplete="off">
    </div>
    <div class="filter-group">
      <label for="f-email">Email</label>
      <input type="text" id="f-email" placeholder="Es. mario@…" autocomplete="off">
    </div>
    <div class="filter-group">
      <label>Quiz creati (min – max)</label>
      <div class="extracted-style-13262f">
        <input class="extracted-style-4ebf8b" type="number" id="f-min-quiz" placeholder="Min" min="0" step="1">
        <input class="extracted-style-4ebf8b" type="number" id="f-max-quiz" placeholder="Max" min="0" step="1">
      </div>
    </div>
    <div class="filter-group">
      <label>Partecipazioni (min – max)</label>
      <div class="extracted-style-13262f">
        <input class="extracted-style-4ebf8b" type="number" id="f-min-part" placeholder="Min" min="0" step="1">
        <input class="extracted-style-4ebf8b" type="number" id="f-max-part" placeholder="Max" min="0" step="1">
      </div>
    </div>
    <button class="btn-reset-filter" id="btn-reset">Azzera filtri</button>
  </aside>

  <main class="main-content">
    <div class="page-title">
      <h2>👥 Utenti</h2>
    </div>
    <div class="spinner" id="spinner"></div>
    <div id="results-container" class="table-container-scroll extracted-style-d3297f"></div>
  </main>
</div>
{% endblock %}

{% block extra_scripts %}
{% endblock %}
